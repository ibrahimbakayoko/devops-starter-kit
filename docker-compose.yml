version: '3.8'

services:
  backend:
    build:
      context: ./app/backend
      dockerfile: ../../docker/Dockerfile.backend
    ports:
      - "3000:3000"
    env_file:
      - .env

  frontend:
    build:
      context: ./app/frontend
      dockerfile: ../../docker/Dockerfile.frontend
    ports:
      - "5173:5173"

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"